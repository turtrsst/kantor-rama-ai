<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>KRA - Registrasi Anggota</title>
  <link rel="stylesheet" href="style.css?v=20261030-ui-refresh-2">
  <link rel="stylesheet" href="auth.css?v=20261030-auth-refresh-1">
</head>
<body class="auth-page register-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Registrasi anggota</h1>
      <p>Pendaftaran anggota dilakukan melalui layanan SIAS resmi.</p>
    </div>
    <div class="alert" style="display:block">Untuk keamanan akun, registrasi anggota KRA dilanjutkan melalui SIAS resmi.</div>
    <div class="auth-footer">
      <a href="../../sias/sinomor/register_sinomor.php">Lanjutkan ke registrasi SIAS</a>
    </div>
      <div class="scroll-box">
        <div class="form-grid">
          <div class="form-group full">
            <label>NAMA LENGKAP</label>
            <input type="text" name="nama_lengkap" class="kra-input" placeholder="Nama Lengkap" required>
          </div>
          <div class="form-group">
            <label>NIP</label>
            <input type="text" name="nip" class="kra-input" placeholder="NIP">
          </div>
          <div class="form-group">
            <label>EMAIL</label>
            <input type="email" name="email" class="kra-input" placeholder="email@instansi.go.id" required>
          </div>
          <div class="form-group">
            <label>USERNAME</label>
            <input type="text" name="username" class="kra-input" placeholder="Username" required>
          </div>
          <div class="form-group">
            <label>WHATSAPP</label>
            <input type="text" name="no_telepon" class="kra-input" placeholder="08xxxx" required>
          </div>
          <div class="form-group">
            <label>JABATAN</label>
            <input type="text" name="jabatan" class="kra-input" placeholder="Jabatan" required>
          </div>
          <div class="form-group">
            <label>UNIT KERJA</label>
            <input type="text" name="unit_kerja" class="kra-input" placeholder="Unit Kerja" required>
          </div>
          <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" name="password" class="kra-input" placeholder="******" required>
          </div>
          <div class="form-group">
            <label>KONFIRMASI PW</label>
            <input type="password" name="password_confirm" class="kra-input" placeholder="******" required>
          </div>
        </div>
      </div>
      <button type="submit" class="kra-btn">AJUKAN AKUN</button>
    </form>
    
    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Login SIAS</a>
    </div>
  </div>


</body>
</html>
