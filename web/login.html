<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRA - Login Kehadiran</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--paper-200);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: var(--cream-100);
      border: 4px solid var(--ink-900);
      box-shadow: 8px 8px 0 var(--ink-900);
      width: 400px;
      padding: 2rem;
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--maroon);
      margin-bottom: 10px;
    }
    .auth-header p {
      font-family: var(--font-ui);
      font-size: 18px;
      color: var(--ink-700);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-family: var(--font-display);
      font-size: 10px;
      margin-bottom: 8px;
      color: var(--ink-900);
    }
    .kra-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--ink-900);
      background: var(--cream-50);
      font-family: var(--font-ui);
      font-size: 18px;
      color: var(--ink-900);
      box-sizing: border-box;
    }
    .kra-btn {
      width: 100%;
      padding: 12px;
      border: 4px solid var(--ink-900);
      background: var(--gold);
      font-family: var(--font-display);
      font-size: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink-900);
      margin-top: 1rem;
    }
    .kra-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink-900);
    }
    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      font-family: var(--font-ui);
      font-size: 14px;
    }
    .auth-footer a {
      color: var(--maroon);
      text-decoration: underline;
    }
    .alert {
      background: var(--coral);
      color: white;
      padding: 10px;
      font-family: var(--font-ui);
      font-size: 14px;
      border: 2px solid var(--ink-900);
      margin-bottom: 1rem;
      display: none;
    }
    .neon-border {
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border: 2px solid var(--sky);
      pointer-events: none;
      z-index: -1;
      opacity: 0.5;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="auth-card">
    <div class="neon-border"></div>
    <div class="auth-header">
      <h1>KANTOR RAMA AI</h1>
      <p>System Login Kehadiran</p>
    </div>
    <div id="login-error" class="alert"></div>
    <form id="login-form">
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" name="username" class="kra-input" placeholder="Masukkan username SIAS" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" name="password" class="kra-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <button type="submit" class="kra-btn">MASUK KANTOR</button>
    </form>
    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Registrasi SIAS</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const errorDiv = document.getElementById('login-error');
      
      try {
        const res = await fetch('../api/index.php?action=login', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.ok) {
          localStorage.setItem('kra_auth_token', data.token);
          localStorage.setItem('kra_active_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          errorDiv.textContent = data.error || 'Gagal login';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Gagal menghubungi server';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
