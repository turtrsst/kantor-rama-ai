<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>KRA - Login Kantor</title>
  <link rel="stylesheet" href="style.css?v=20261030-ui-refresh-2">
  <link rel="stylesheet" href="auth.css?v=20261030-auth-refresh-1">
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-header">
      <h1>Selamat datang kembali</h1>
      <p>Masuk untuk melanjutkan ke ruang kerja Kantor Rama AI.</p>
    </header>
    <div id="login-error" class="alert" role="alert" aria-live="polite"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" name="username" class="kra-input" placeholder="Masukkan username SIAS" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" name="password" class="kra-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <button type="submit" class="kra-btn">Masuk ke kantor</button>
    </form>
    <footer class="auth-footer">Belum punya akun? <a href="register.html">Registrasi melalui SIAS</a></footer>
  </main>
  <script src="login.js?v=20261029-session-auth" defer></script>
</body>
</html>
