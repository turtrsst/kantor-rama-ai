<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf2eb">
  <title>Manual Pengguna — Kantor Rama AI</title>
  <link rel="stylesheet" href="style.css?v=20261030-ui-refresh-2">
  <link rel="stylesheet" href="ui_refresh.css?v=20261030-ui-refresh-4">
  <link rel="stylesheet" href="manual_refresh.css?v=20261030-manual-modern-1">
</head>
<body class="manual-page">
  <header class="manual-header">
    <a class="manual-brand" href="index.html" aria-label="Kembali ke Kantor Rama AI">
      <span class="manual-brand-mark" aria-hidden="true">K</span>
      <span><small>KANTOR RAMA AI</small><strong>Manual Pengguna</strong></span>
    </a>
    <div class="manual-actions">
      <button class="kra-btn kra-btn-secondary" id="btn-back-office" type="button">Kembali ke kantor</button>
      <button class="kra-btn kra-btn-secondary" id="btn-manual-theme" type="button" aria-pressed="false">Mode gelap</button>
      <button class="kra-btn kra-btn-primary" id="btn-manual-print" type="button">Cetak manual</button>
    </div>
  </header>

  <main class="manual-layout">
    <nav class="manual-toc" id="manual-toc" aria-label="Daftar isi manual">
      <div class="manual-toc-heading"><span>JELAJAHI</span><h2>Daftar isi</h2></div>
      <ol id="manual-toc-list"></ol>
    </nav>
    <article class="manual-doc" id="manual-doc" aria-busy="true">
      <div class="manual-loading"><span class="manual-loading-dot"></span> Memuat manual pengguna…</div>
    </article>
  </main>

  <script src="kra_manual_render.js?v=20261030-modern-manual-1"></script>
  <script>
    const docEl = document.getElementById('manual-doc');
    const tocList = document.getElementById('manual-toc-list');
    const themeButton = document.getElementById('btn-manual-theme');

    function applyTheme(dark) {
      document.body.classList.toggle('dark-mode', dark);
      themeButton.textContent = dark ? 'Mode terang' : 'Mode gelap';
      themeButton.setAttribute('aria-pressed', String(dark));
      try { localStorage.setItem('kra-theme', dark ? 'dark' : 'light'); } catch (_) { /* Preference is optional. */ }
    }

    let darkMode = false;
    try { darkMode = localStorage.getItem('kra-theme') === 'dark'; } catch (_) { /* Use light theme. */ }
    applyTheme(darkMode);
    themeButton.addEventListener('click', () => applyTheme(!document.body.classList.contains('dark-mode')));
    document.getElementById('btn-manual-print').addEventListener('click', () => window.print());
    document.getElementById('btn-back-office').addEventListener('click', () => { window.location.href = 'index.html'; });

    fetch('/docs/USER_MANUAL.md', { cache: 'no-cache' })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(markdown => {
        const { html, toc } = window.KRAManual.render(markdown);
        docEl.innerHTML = html;
        docEl.setAttribute('aria-busy', 'false');
        tocList.innerHTML = toc.map(entry =>
          '<li class="' + (entry.level === 3 ? 'sub' : '') + '"><a href="#' + entry.id + '">' + window.KRAManual.esc(entry.text) + '</a></li>'
        ).join('');
      })
      .catch(error => {
        docEl.innerHTML = '<div class="manual-error"><h2>Manual tidak dapat dimuat</h2><p>Berkas panduan tidak terbaca: '
          + window.KRAManual.esc(error.message) + '.</p><p>Pastikan folder <code>docs/</code> tersedia di document root server.</p></div>';
        docEl.setAttribute('aria-busy', 'false');
      });
  </script>
</body>
</html>
