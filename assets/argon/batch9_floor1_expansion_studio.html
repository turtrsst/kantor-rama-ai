const AMBER = '#ffcc4d';
const MAGENTA = '#ff38b8';

let currentMode = 'day';

const CACHE = [];

function createBuf(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return { canvas: c, ctx };
}

function px(ctx, x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function box(ctx, x, y, w, h, fill, hi = null) {
  px(ctx, x, y, w, h, OUT);
  if (w > 2 && h > 2) px(ctx, x + 1, y + 1, w - 2, h - 2, fill);
  if (hi && w > 2) px(ctx, x + 1, y + 1, w - 2, 1, hi);

function renderBatch9() {
  const grid = document.getElementById('assetGrid');
  grid.innerHTML = '';
  CACHE.length = 0;

  BATCH9_ASSETS.forEach(def => {
    const dif = createBuf(def.w, def.h);
    const em = createBuf(def.w, def.h);
    def.draw(dif.ctx, em.ctx);

    CACHE.push({ ...def, difCanvas: dif.canvas, emCanvas: em.canvas });

    if (currentRoom !== 'ALL' && def.room !== currentRoom) return;

    const card = document.createElement('div');
    card.className = 'card';

    const topTags = document.createElement('div');
    topTags.className = 'card-top-tags';
    topTags.innerHTML = `
      <span class="room-tag">${def.room}</span>
      <span class="layer-tag">Layer: ${def.layer}</span>
    `;

    const pBox = document.createElement('div');
    pBox.className = 'preview-box' + (currentMode === 'night' ? ' night-mode' : '');

    const cv = document.createElement('canvas');
    const scale = def.w >= 96 ? 2.4 : 3;
    cv.width = def.w; cv.height = def.h;
    cv.style.width = (def.w * scale) + 'px';
    cv.style.height = (def.h * scale) + 'px';
    cv.className = 'pixel';

    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    if (currentMode === 'day') {
      ctx.drawImage(dif.canvas, 0, 0);
    } else if (currentMode === 'emission') {
      ctx.drawImage(em.canvas, 0, 0);
    } else {
      ctx.drawImage(dif.canvas, 0, 0);
      ctx.fillStyle = 'rgba(8, 12, 24, 0.56)';
      ctx.fillRect(0, 0, def.w, def.h);
      ctx.drawImage(em.canvas, 0, 0);
    }

    pBox.appendChild(cv);

    const titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = def.title;

    const descEl = document.createElement('div');
    descEl.className = 'card-desc';
    descEl.textContent = def.desc;

    const specsEl = document.createElement('div');
    specsEl.className = 'meta-specs';
    specsEl.textContent = `Size: ${def.w}×${def.h}px (${def.footprint}) | Pivot: ${def.pivot} | Collide: ${def.collision}`;

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const btnD = document.createElement('button');
    btnD.textContent = '⬇ Diffuse .PNG';
    btnD.onclick = () => downloadCanvas(dif.canvas, `${def.id}.png`);

    const btnE = document.createElement('button');
    btnE.textContent = '⬇ Emission .PNG';
    btnE.onclick = () => downloadCanvas(em.canvas, `${def.id}_emission.png`);

    actions.appendChild(btnD);
    actions.appendChild(btnE);

    card.appendChild(topTags);
    card.appendChild(pBox);
    card.appendChild(titleEl);
    card.appendChild(descEl);
    card.appendChild(specsEl);
    card.appendChild(actions);
    grid.appendChild(card);
  });
}

function setRoom(r, btn) {
  currentRoom = r;
  document.querySelectorAll('.rm-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBatch9();
}

function setMode(m, btn) {
  currentMode = m;
  document.querySelectorAll('.md-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBatch9();
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function toB64(canvas) {
  return canvas.toDataURL('image/png').split(',')[1];
}

async function downloadBatch9Zip() {
  const banner = document.getElementById('statusBanner');
  banner.style.display = 'block';
  banner.textContent = 'Sedang mengemas 27 Grup Aset Floor 1 + Master Atlas + Collision/Pivot Manifest ke dalam ZIP...';

  const zip = new JSZip();
  const fAtlas = zip.folder('Batch9_Floor1_Complete_Expansion/00_Master_Atlas');

  const atlasDif = createBuf(384, 480);
  const atlasEm = createBuf(384, 480);
  let cx = 0, cy = 0, rowH = 0;

  const manifest = {
    batch: "Batch 9 - Floor 1 Complete Missing Assets & Grand Runway",
    grid_unit: 32,
    outline: "#14182E",
    assets: []
  };

  CACHE.forEach(item => {
    const safeRoom = item.room.replace(/\s+/g, '_');
    const rFolder = zip.folder(`Batch9_Floor1_Complete_Expansion/${safeRoom}`);
    rFolder.file(`diffuse/${item.id}.png`, toB64(item.difCanvas), { base64: true });
    rFolder.file(`emission/${item.id}_emission.png`, toB64(item.emCanvas), { base64: true });

    if (cx + item.w > 384) {
      cx = 0;
      cy += rowH + 4;
      rowH = 0;
    }
    atlasDif.ctx.drawImage(item.difCanvas, cx, cy);
    atlasEm.ctx.drawImage(item.emCanvas, cx, cy);

    manifest.assets.push({
      id: item.id,
      room: item.room,
      title: item.title,
      placement_layer: item.layer,
      dimensions: { width: item.w, height: item.h },
      footprint_tiles: item.footprint,
      pivot: item.pivot,
      has_collision: item.collision,
      atlas_uv: { x: cx, y: cy, w: item.w, h: item.h },
      states: ["clean", "active", "warning"],
      files: {
        diffuse: `${safeRoom}/diffuse/${item.id}.png`,
        emission: `${safeRoom}/emission/${item.id}_emission.png`
      }
    });

    cx += item.w + 4;
    if (item.h > rowH) rowH = item.h;
  });

  fAtlas.file('batch9_floor1_diffuse_atlas.png', toB64(atlasDif.canvas), { base64: true });
  fAtlas.file('batch9_floor1_emission_atlas.png', toB64(atlasEm.canvas), { base64: true });
  zip.folder('Batch9_Floor1_Complete_Expansion').file('batch9_floor1_expansion_manifest.json', JSON.stringify(manifest, null, 2));

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.download = 'Batch9_Floor1_Complete_Expansion.zip';
  a.href = URL.createObjectURL(blob);
