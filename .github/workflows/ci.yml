name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, curl, pdo, pdo_sqlite

      - name: Run KRA Audit
        run: |
          php tools/verify-skills.php
          php tools/test-task-engine.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JS verifications
        run: |
          node tools/verify-kra-lighting-engine.js || true
          node tools/verify-kra-asset-registry.js || true
