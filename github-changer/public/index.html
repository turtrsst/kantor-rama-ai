<!doctype html>
<html lang="id" data-theme="dark" data-accent="aurora">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="GitHub Changer — dashboard lokal untuk maintain akun & repository GitHub: push, pull, clone, dan peta alur Git." />
  <title>GitHub Changer · Dashboard Git Lokal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">✦</div>
      <div class="boot-title">GitHub Changer</div>
      <div class="boot-sub">Menyiapkan dashboard Git lokal…</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>

  <noscript>App ini membutuhkan JavaScript. Jalankan <code>npm start</code> lalu buka di browser.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
